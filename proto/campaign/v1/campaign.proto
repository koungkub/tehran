syntax = "proto3";

package proto.campaign.v1;

import "google/protobuf/timestamp.proto";

// CampaignService is CRUD over the campaign aggregate root. Events belong to a
// campaign and are served by EventService in this same package; deleting a
// campaign takes its events with it.
service CampaignService {
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse) {}
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse) {}
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse) {}
  rpc UpdateCampaign(UpdateCampaignRequest) returns (UpdateCampaignResponse) {}
  rpc DeleteCampaign(DeleteCampaignRequest) returns (DeleteCampaignResponse) {}
}

// CampaignStatus mirrors the status CHECK constraint on the campaigns table.
// Adding a value here means adding it there, in a migration.
enum CampaignStatus {
  CAMPAIGN_STATUS_UNSPECIFIED = 0;
  CAMPAIGN_STATUS_DRAFT = 1;
  CAMPAIGN_STATUS_ACTIVE = 2;
  CAMPAIGN_STATUS_PAUSED = 3;
  CAMPAIGN_STATUS_ENDED = 4;
}

message Campaign {
  string id = 1;
  string name = 2;
  string description = 3;
  CampaignStatus status = 4;
  // start_at and end_at are both optional, and unset means open-ended. When
  // both are set, end_at has to be after start_at — enforced in the service and
  // again by a CHECK constraint.
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateCampaignRequest {
  // name is required.
  string name = 1;
  string description = 2;
  // status defaults to CAMPAIGN_STATUS_DRAFT when unspecified.
  CampaignStatus status = 3;
  google.protobuf.Timestamp start_at = 4;
  google.protobuf.Timestamp end_at = 5;
}

message CreateCampaignResponse {
  Campaign campaign = 1;
}

message GetCampaignRequest {
  string id = 1;
}

message GetCampaignResponse {
  Campaign campaign = 1;
}

message ListCampaignsRequest {
  // page_size is clamped to [1, 100] and defaults to 20.
  int32 page_size = 1;
  // page_token is the next_page_token of a previous response, and is opaque:
  // anything else is rejected rather than treated as "start from the top".
  string page_token = 2;
}

message ListCampaignsResponse {
  // campaigns are newest-first, ordered by (created_at, id) descending.
  repeated Campaign campaigns = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

// UpdateCampaignRequest is a partial update: every mutable field is optional and
// an absent one is left as it is. That is what `optional` buys here — without it
// there is no way to tell "set description to empty" from "do not touch it".
//
// The timestamps have no such problem: a message field is already distinguishable
// from unset. Clearing one back to open-ended therefore needs its own flag rather
// than a null, which is what clear_start_at and clear_end_at are.
message UpdateCampaignRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional CampaignStatus status = 4;
  google.protobuf.Timestamp start_at = 5;
  google.protobuf.Timestamp end_at = 6;
  bool clear_start_at = 7;
  bool clear_end_at = 8;
}

message UpdateCampaignResponse {
  Campaign campaign = 1;
}

message DeleteCampaignRequest {
  string id = 1;
}

// DeleteCampaignResponse reports how many events went with the campaign, since
// the cascade is the part of this call a caller cannot see coming.
message DeleteCampaignResponse {
  int64 deleted_events = 1;
}
