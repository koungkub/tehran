syntax = "proto3";

package proto.campaign.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// EventService is CRUD over events. Every event belongs to exactly one campaign,
// so campaign_id is required on create and on list: there is no RPC here that
// reads or writes an event without naming its campaign.
service EventService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {}
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {}
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {}
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse) {}
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse) {}
}

message Event {
  string id = 1;
  // campaign_id is set once, at creation. UpdateEvent refuses to change it:
  // moving an event to another campaign is a different operation from editing
  // one, and doing it by accident is what an immutable parent prevents.
  string campaign_id = 2;
  string name = 3;
  // type is the caller's own taxonomy (impression, click, conversion, …). It is
  // a free string rather than an enum so that adding one is not a schema change.
  string type = 4;
  // payload is arbitrary event-specific data, stored as jsonb.
  google.protobuf.Struct payload = 5;
  // occurred_at is when the event happened, which is not when it was recorded:
  // a backfill sets it in the past. It defaults to now when omitted.
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateEventRequest {
  // campaign_id is required and must name a campaign that exists.
  string campaign_id = 1;
  // name is required.
  string name = 2;
  string type = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message CreateEventResponse {
  Event event = 1;
}

message GetEventRequest {
  string id = 1;
}

message GetEventResponse {
  Event event = 1;
}

message ListEventsRequest {
  // campaign_id is required: listing every event in the service regardless of
  // campaign is not a query this API offers.
  string campaign_id = 1;
  // page_size is clamped to [1, 100] and defaults to 20.
  int32 page_size = 2;
  string page_token = 3;
}

message ListEventsResponse {
  // events are newest-first, ordered by (occurred_at, id) descending.
  repeated Event events = 1;
  string next_page_token = 2;
}

// UpdateEventRequest is a partial update — see the note on UpdateCampaignRequest
// for why the scalars are optional. campaign_id is deliberately absent.
message UpdateEventRequest {
  string id = 1;
  optional string name = 2;
  optional string type = 3;
  google.protobuf.Struct payload = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message UpdateEventResponse {
  Event event = 1;
}

message DeleteEventRequest {
  string id = 1;
}

message DeleteEventResponse {}
