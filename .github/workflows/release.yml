name: release

on:
  # Reached from tag.yml, since a tag pushed by GITHUB_TOKEN cannot trigger the
  # push event below.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  # And directly, for a tag pushed by hand from a laptop.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}

      # No setup-qemu-action: the Dockerfile cross-compiles, and the runtime
      # stage only COPYs, so nothing foreign-arch is ever executed at build time.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # value= is empty on the push path, where the action reads the ref
          # itself; it is only needed for the workflow_call path.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          # latest=auto moves :latest for a release but leaves it alone for a
          # prerelease, so v1.4.0-rc1 never becomes the default pull.
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # .dockerignore excludes .git, so the build cannot derive either of
          # these on its own — unset, the image reports itself as dev/none
          # forever, and `tehran version` stops meaning anything.
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
