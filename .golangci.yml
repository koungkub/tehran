version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        # pkg/ is a library other repositories import; internal/ is this service.
        # Go does NOT enforce this direction — internal/ is importable from
        # anywhere inside the same module, pkg/ included — so this rule is the
        # only thing stopping the library from reaching back into the app.
        pkg-no-internal:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/koungkub/tehran/internal
              desc: pkg is a public library; it must never import internal packages
        # The pkg modules are independently usable: connectrpc accepts the
        # OpenTelemetry provider interfaces, so it needs no telemetry setup of
        # its own. Importing telemetry here would fuse the two into one unit.
        connectrpc-no-telemetry:
          files:
            - "**/pkg/connectrpc/**"
          deny:
            - pkg: github.com/koungkub/tehran/pkg/telemetry
              desc: connectrpc takes otel provider interfaces, not the telemetry package
        # Domain modules are isolated bounded contexts: they talk to each other
        # only through interfaces wired at the composition root (internal/app),
        # never by importing a sibling directly. One rule per domain, naming the
        # others.
        greeter-no-siblings:
          files:
            - "**/internal/greeter/**"
          deny:
            - pkg: github.com/koungkub/tehran/internal/campaign
              desc: domain modules must not import siblings
            - pkg: github.com/koungkub/tehran/internal/postgres
              desc: a domain declares repository interfaces; the adapter implements them
        campaign-no-siblings:
          files:
            - "**/internal/campaign/**"
          deny:
            - pkg: github.com/koungkub/tehran/internal/greeter
              desc: domain modules must not import siblings
            # The one that keeps the layering honest. internal/campaign declares
            # the repository interfaces and internal/postgres satisfies them, so
            # the import runs adapter -> domain and never back. Reversing it would
            # compile, which is why it is a lint rule.
            - pkg: github.com/koungkub/tehran/internal/postgres
              desc: a domain declares repository interfaces; the adapter implements them
  exclusions:
    paths:
      - gen

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - gen
