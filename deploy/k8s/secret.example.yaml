# Placeholders. This file is a reference, not something to apply: it is not in
# kustomization.yaml, and the values below are not credentials.
#
# Create the real Secret directly, so it exists only in the cluster:
#
#   kubectl create secret generic tehran-database -n tehran \
#     --from-literal=TEHRAN_DATABASE_HOST=postgres.default.svc.cluster.local \
#     --from-literal=TEHRAN_DATABASE_PORT=5432 \
#     --from-literal=TEHRAN_DATABASE_USER=tehran \
#     --from-literal=TEHRAN_DATABASE_PASSWORD='...' \
#     --from-literal=TEHRAN_DATABASE_DATABASE=tehran
#
# Both the Deployment and the migration Job read it with envFrom, so the keys
# are the environment variable names the binary expects, unchanged.
#
# Rotating: recreate the Secret, then `kubectl rollout restart
# deployment/tehran -n tehran`. envFrom is read at container start, so a
# changed Secret reaches nothing until the pod is replaced.
apiVersion: v1
kind: Secret
metadata:
  name: tehran-database
  namespace: tehran
type: Opaque
stringData:
  TEHRAN_DATABASE_HOST: postgres.default.svc.cluster.local
  TEHRAN_DATABASE_PORT: "5432"
  TEHRAN_DATABASE_USER: tehran
  TEHRAN_DATABASE_PASSWORD: replace-me
  TEHRAN_DATABASE_DATABASE: tehran
