# Deployment stack for Coolify. Add this repository as a Docker Compose
# resource and set the compose path to deploy/coolify.yaml — the root
# compose.yaml is the local development database only, and Coolify would
# otherwise find that one first and deploy a bare Postgres.
#
# Postgres is NOT defined here. It is its own Coolify resource, which means two
# things have to be true for this app to reach it:
#
#   1. "Connect to Predefined Network" must be on for this resource, or the
#      database's container name will not resolve from here — the two stacks
#      are on separate compose networks until it is.
#   2. The TEHRAN_DATABASE_* values below come from Coolify's Environment
#      Variables tab, not from this file. The password especially: it does not
#      belong in git, and the hostname is Coolify's to assign, not ours to
#      guess. Copy them from the Postgres resource page.
#
# Set, in Coolify → Environment Variables:
#
#   TEHRAN_DATABASE_HOST      the Postgres resource's internal hostname
#   TEHRAN_DATABASE_PORT      5432 unless it was changed
#   TEHRAN_DATABASE_USER      its username
#   TEHRAN_DATABASE_PASSWORD  its password
#   TEHRAN_DATABASE_DATABASE  the database name
#
# Migrations run as their own service, below, and the api waits for them to
# succeed. Coolify's pre/post-deployment command fields cannot do this job:
# they run `docker exec <container> sh -c '<command>'`, and the runtime image
# is distroless, so the wrapper fails with `exec: "sh": executable file not
# found in $PATH` before the command is even read.
#
# The environment is written out once per service rather than shared through a
# YAML anchor. The duplication is deliberate: Coolify parses and rewrites this
# file, and an anchor is a dependency on its YAML merge-key handling for no
# gain beyond brevity. Keep the two blocks, and the two image tags, in step.

services:
  # Runs to completion and exits; it is not a server. Every deploy applies
  # whatever is pending, and goose skips what is already applied, so a deploy
  # with no new migrations costs one connection and a few milliseconds.
  migrate:
    # Must match the tehran service's tag exactly. A schema migrated by one
    # version and served by another is the failure this whole ordering exists
    # to prevent.
    image: ghcr.io/koungkub/tehran:0.1.0

    # Overrides the image's default CMD of ["api"]. ENTRYPOINT is already
    # /tehran, so this is `/tehran db migrate` — no shell involved.
    command: ["db", "migrate"]

    # Without this the container is restarted after it exits successfully, and
    # a service that is supposed to finish never registers as finished.
    restart: "no"

    environment:
      - TEHRAN_DATABASE_ENABLED=true
      - TEHRAN_DATABASE_DRIVER=postgres
      - TEHRAN_DATABASE_HOST=${TEHRAN_DATABASE_HOST}
      - TEHRAN_DATABASE_PORT=${TEHRAN_DATABASE_PORT:-5432}
      - TEHRAN_DATABASE_USER=${TEHRAN_DATABASE_USER}
      - TEHRAN_DATABASE_PASSWORD=${TEHRAN_DATABASE_PASSWORD}
      - TEHRAN_DATABASE_DATABASE=${TEHRAN_DATABASE_DATABASE}
      - TEHRAN_DATABASE_SSL_MODE=${TEHRAN_DATABASE_SSL_MODE:-disable}
      - TEHRAN_OTEL_ENABLED=false
      - TEHRAN_LOG_LEVEL=info
      - TEHRAN_LOG_FORMAT=json

  tehran:
    # Pinned, not :latest. Releasing is already an explicit act (the tag
    # workflow); upgrading here should be the same, and a pinned version in git
    # is the record of what is actually deployed.
    image: ghcr.io/koungkub/tehran:0.1.0
    restart: unless-stopped

    # service_completed_successfully, not service_started: a migration that
    # fails must stop the rollout rather than hand traffic to a service whose
    # schema is half-applied. Readiness would not catch it either — /readyz
    # answers 200 against an unmigrated database, because it checks the
    # connection and not the schema.
    depends_on:
      migrate:
        condition: service_completed_successfully

    # No healthcheck stanza: the runtime image is distroless and ships nothing
    # but the binary — no shell, no curl, no wget for a CMD to invoke. Use
    # Coolify's own HTTP health check instead, pointed at /readyz on port 9090.
    #
    # The database is a separate Coolify resource with its own lifecycle, so it
    # cannot be waited on from here. That is what restart: unless-stopped
    # covers — the api command exits on a failed connection and is restarted
    # until Postgres answers.

    environment:
      # Coolify generates a domain for this service and points its proxy at
      # 8080, the Connect RPC port. 9090 is ops (/healthz, /readyz, /metrics)
      # and is deliberately not published — it has no business being reachable
      # from outside the server.
      - SERVICE_FQDN_TEHRAN_8080

      # Without this the api command exits 1 on boot: the campaign domain
      # persists, and it refuses to start over a nil repository rather than
      # panic on its first request.
      - TEHRAN_DATABASE_ENABLED=true
      - TEHRAN_DATABASE_DRIVER=postgres

      # Supplied by Coolify, per the header. Left unset, the defaults compiled
      # into the binary point at 127.0.0.1 with an empty user, which fails at
      # startup rather than connecting to something unexpected.
      - TEHRAN_DATABASE_HOST=${TEHRAN_DATABASE_HOST}
      - TEHRAN_DATABASE_PORT=${TEHRAN_DATABASE_PORT:-5432}
      - TEHRAN_DATABASE_USER=${TEHRAN_DATABASE_USER}
      - TEHRAN_DATABASE_PASSWORD=${TEHRAN_DATABASE_PASSWORD}
      - TEHRAN_DATABASE_DATABASE=${TEHRAN_DATABASE_DATABASE}
      # Overridable, because "the database is on this host" is an assumption
      # that stops holding the moment it moves to a managed one.
      - TEHRAN_DATABASE_SSL_MODE=${TEHRAN_DATABASE_SSL_MODE:-disable}

      # Defaults to on, aimed at localhost:4317, which is nothing inside a
      # container. Turn it back on with the collector's address when there is
      # one to send to.
      - TEHRAN_OTEL_ENABLED=false

      - TEHRAN_LOG_LEVEL=info
      - TEHRAN_LOG_FORMAT=json
